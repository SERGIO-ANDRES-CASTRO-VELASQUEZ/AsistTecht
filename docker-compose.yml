services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asisqr
      POSTGRES_USER: asisqr
      POSTGRES_PASSWORD: asisqr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asisqr -d asisqr"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=asisqr;Username=asisqr;Password=asisqr
      Jwt__Key: AsisQR-clave-local-cambiar-en-servidor-2026
      Jwt__Issuer: AsisQR
      Jwt__Audience: AsisQR
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddydata:
