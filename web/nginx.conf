server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BUG-SEC-05: Cabeceras de seguridad HTTP y mitigación de Clickjacking, XSS y Sniffing
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: wss:; font-src 'self' data:;" always;

    # Resolver interno de Docker para evitar caídas al inicio si api tarda unos segundos
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_backend http://api:8080;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /models/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
